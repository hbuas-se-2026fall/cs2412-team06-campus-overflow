# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（领域层 + 应用层，毫秒级，无外部依赖）
      # 限定已实现上下文（共享内核 + Identity + Q&A）；co-reputation/co-discovery 为 S3 占位骨架，
      # 其框架自带测试待 Sprint3 实现后恢复纳入（QA 维护记录见 S2 验收报告）。
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -pl co-shared-kernel,co-identity,co-qa -am

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      # -am 连带构建依赖模块；仅执行 ArchitectureTest，S3 占位模块的测试不会在此阶段运行。
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

      # 阶段 4：覆盖率报告（JaCoCo；门禁阈值随 Sprint 推进提升，见父 pom domain.coverage.minimum）
      # 同样限定已实现上下文，避免 S3 占位模块测试阻断统计。
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl co-shared-kernel,co-identity,co-qa -am

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis）
      # 只执行 failsafe 的 *IT 验收测试（co-bootstrap E2E）；用 -Dtest='!*Test' 显式排除
      # surefire 单测（阶段 2 已执行），避免 S3 占位模块的单元测试在此阶段再次阻断。
      - name: 集成测试
        run: mvn -B -f backend/pom.xml verify -Dtest='!*Test' -DfailIfNoTests=false

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
