# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 0：代码风格检查（Checkstyle；规则集 config/checkstyle/checkstyle.xml，error 级违规即红）
      - name: 代码风格检查
        run: mvn -B -f backend/pom.xml checkstyle:check

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（领域层 + 应用层，毫秒级，无外部依赖）
      # 必须列出具体子模块路径：只写聚合器（co-qa 等）不会构建其子模块，测试会空跑。
      # 覆盖全部已实现上下文（共享内核由 -am 带入）。
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -pl co-identity/co-identity-domain,co-identity/co-identity-application,co-qa/co-qa-domain,co-qa/co-qa-application,co-reputation/co-reputation-domain,co-reputation/co-reputation-application,co-discovery/co-discovery-domain,co-discovery/co-discovery-application -am

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）
      # -am 连带构建依赖模块；仅执行 ArchitectureTest，S3 占位模块的测试不会在此阶段运行。
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

      # 阶段 4：覆盖率报告与门禁（JaCoCo；阈值见父 pom domain.coverage.minimum，Sprint 3 起为 0.70）
      # 四个领域层模块（identity/qa/reputation/discovery）的 jacoco:check 均在 verify 阶段执行。
      # 同样必须列出具体子模块路径，否则聚合器不会构建子模块、门禁不生效。
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl co-identity/co-identity-domain,co-identity/co-identity-application,co-qa/co-qa-domain,co-qa/co-qa-application,co-reputation/co-reputation-domain,co-reputation/co-reputation-application,co-discovery/co-discovery-domain,co-discovery/co-discovery-application -am

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis）
      # 直接调用 failsafe goal 执行 *IT 验收测试（co-bootstrap E2E），surefire 不参与。
      # 不能用 -DskipTests / -Dmaven.test.skip=true（会连带跳过 failsafe 的集成测试），
      # 也不能用 -Dtest=!*Test 排除（该写法会让 surefire 把 *IT 类纳入单测误跑——E2E 需 Docker，
      # 在单测阶段执行必然失败）。集成测试统一由 failsafe 执行 CampusOverflowFlowIT。
      - name: 集成测试
        run: mvn -B -f backend/pom.xml test-compile failsafe:integration-test failsafe:verify

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      # 前端 ESLint 门禁：从本地手动跑升级为 CI 强制检查，违规即红（Lab7-T4）
      - name: 代码检查 (ESLint)
        working-directory: frontend
        run: npm run lint
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  # 阶段 6：SonarQube 静态扫描（Lab7-T4，从）
  # ubuntu-latest 自带 Docker，用 service container 临时起 SonarQube Community；
  # 质量门禁：覆盖率 > 70%、Bugs = 0、Vulnerabilities = 0（Quality Gate 规则在 SonarQube 侧配置）。
  sonar:
    name: SonarQube 静态扫描
    runs-on: ubuntu-latest
    needs: backend
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 生成 JaCoCo 覆盖率报告（供 Sonar 导入）
      - name: 生成覆盖率报告
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl co-identity/co-identity-domain,co-identity/co-identity-application,co-qa/co-qa-domain,co-qa/co-qa-application,co-reputation/co-reputation-domain,co-reputation/co-reputation-application,co-discovery/co-discovery-domain,co-discovery/co-discovery-application -am

      # 等待临时 SonarQube 实例就绪（首次启动初始化 ES，允许较慢）
      - name: 等待 SonarQube 就绪
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube UP"
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube 在超时内未就绪"
          exit 1

      # 临时实例无仓库 Secret：就绪后用默认 admin:admin 就地生成分析令牌，并建立质量门选中到本项目
      # （新版首次登录会强制改密，但 token 生成接口在改密前仍可用）
      - name: 生成令牌与质量门
        run: |
          set -e
          # 1) 生成分析令牌，写入 GITHUB_ENV 供后续扫描步骤使用，并对日志脱敏
          TOK=$(curl -sf -u admin:admin -X POST \
            'http://localhost:9000/api/user_tokens/generate?name=ci-lab7' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOK"
          echo "SONAR_TOKEN_LOCAL=$TOK" >> "$GITHUB_ENV"

          # 2) 建立质量门 Lab7-Gate（26 版 create 仅返回 name，按门名关联，无数字 id；门已存在则忽略）
          curl -sf -u "$TOK": -X POST \
            'http://localhost:9000/api/qualitygates/create' \
            --data-urlencode 'name=Lab7-Gate' || echo "Lab7-Gate 已存在，跳过创建"

          # 3) 门禁条件：Coverage < 70% 报错、Bugs > 0 报错、Vulnerabilities > 0 报错（26 版参数用 gateName）
          curl -sf -u "$TOK": -X POST 'http://localhost:9000/api/qualitygates/create_condition' \
            -d 'gateName=Lab7-Gate' -d 'metric=coverage' -d 'op=LT' -d 'error=70'
          curl -sf -u "$TOK": -X POST 'http://localhost:9000/api/qualitygates/create_condition' \
            -d 'gateName=Lab7-Gate' -d 'metric=bugs' -d 'op=GT' -d 'error=0'
          curl -sf -u "$TOK": -X POST 'http://localhost:9000/api/qualitygates/create_condition' \
            -d 'gateName=Lab7-Gate' -d 'metric=vulnerabilities' -d 'op=GT' -d 'error=0'

          # 4) 把 Lab7-Gate 设为默认质量门：新项目首次分析即自动套用。
          #    （select 要求项目已存在，全新实例在扫描前项目尚未创建，会 404，故用默认门）
          curl -sf -u "$TOK": -X POST 'http://localhost:9000/api/qualitygates/set_as_default' \
            --data-urlencode 'name=Lab7-Gate'

      # 静态扫描：插件全坐标（CI 干净环境无需后端 pom 声明前缀解析）；令牌取本 job 就地生成的 SONAR_TOKEN_LOCAL；
      # Maven 插件不读取 sonar-project.properties，项目标识/覆盖率路径/字节码目录在命令行显式传入；
      # 扫描后轮询等待质量门结论再退出，门禁不达标即红
      - name: SonarQube 扫描
        run: mvn -B -f backend/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.token=${{ env.SONAR_TOKEN_LOCAL }} \
          -Dsonar.projectKey=campus-overflow \
          -Dsonar.projectName=CampusOverflow \
          "-Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml" \
          -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
