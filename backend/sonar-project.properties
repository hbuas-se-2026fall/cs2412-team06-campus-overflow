# SonarQube 项目配置（Lab7-T4，从）
# 位于 backend/ 下：scanner 以 backend/ 为 basedir，以下路径均相对 backend/
sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=0.1.0-SNAPSHOT

# 源码范围：backend 聚合根（含各子模块）
sonar.sources=.
sonar.sourceEncoding=UTF-8

# 排除构建产物与测试代码
sonar.exclusions=**/target/**,**/src/test/**,**/src/integrationTest/**

# JaCoCo 覆盖率报告（各模块 verify 阶段生成 target/site/jacoco/jacoco.xml）
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# 编译产物目录，供字节码级规则与覆盖率关联
sonar.java.binaries=**/target/classes
